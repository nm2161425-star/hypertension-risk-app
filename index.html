<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hypertension Risk Prediction</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 650px;
            max-width: 92%;
            background: white;

            border-radius: 15px;
            padding: 35px 45px;

            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #222;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
        }

        .form-group label {
            width: 170px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        input,
        select {
            flex: 1;
            height: 42px;

            border: 1px solid #c8c8c8;
            border-radius: 6px;

            padding: 0 12px;
            font-size: 16px;

            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #555;
        }

        .button-container {
            text-align: center;
            margin-top: 28px;
            margin-bottom: 28px;
        }

        button {
            padding: 12px 30px;

            border: none;
            border-radius: 7px;

            background: #333;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .result-box {
            text-align: center;

            margin-top: 15px;
            padding: 20px;

            border-top: 1px solid #ddd;
        }

        .risk {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .probability {
            font-size: 18px;
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #777;
        }

        @media (max-width: 600px) {

            .app-container {
                padding: 25px 20px;
            }

            .form-group {
                display: block;
            }

            .form-group label {
                display: block;
                width: 100%;
                margin-bottom: 7px;
            }

            input,
            select {
                width: 100%;
            }

            .title {
                font-size: 22px;
            }
        }

    </style>
</head>


<body>

    <div class="app-container">

        <div class="title">
            Hypertension Risk Prediction System
        </div>


        <!-- Age -->
        <div class="form-group">

            <label for="age">
                Age:
            </label>

            <input
                type="number"
                id="age"
                placeholder="Enter age"
                min="1"
                max="120"
            >

        </div>


        <!-- BMI -->
        <div class="form-group">

            <label for="bmi">
                BMI:
            </label>

            <input
                type="number"
                id="bmi"
                placeholder="Enter BMI"
                step="0.1"
                min="1"
                max="100"
            >

        </div>


        <!-- Smoking -->
        <div class="form-group">

            <label for="smoking">
                Smoking:
            </label>

            <select id="smoking">

                <option value="1">
                    Smoker
                </option>

                <option value="0">
                    Non-Smoker
                </option>

            </select>

        </div>


        <!-- Family History -->
        <div class="form-group">

            <label for="family">
                Family History:
            </label>

            <select id="family">

                <option value="1">
                    YES
                </option>

                <option value="0">
                    NO
                </option>

            </select>

        </div>


        <!-- Stress Score -->
        <div class="form-group">

            <label for="stress">
                Stress Score:
            </label>

            <input
                type="number"
                id="stress"
                placeholder="1 - 5"
                min="1"
                max="5"
                step="1"
            >

        </div>


        <!-- Button -->
        <div class="button-container">

            <button onclick="predictRisk()">
                PREDICT RISK
            </button>

        </div>


        <!-- Results -->
        <div class="result-box">

            <div
                class="risk"
                id="result"
            >
                Risk:
            </div>

            <div
                class="probability"
                id="probability"
            >
                Probability:
            </div>

        </div>


        <div class="message">
            For educational and research purposes only.
        </div>

    </div>


<script>

async function predictRisk() {

    // Get input values
    const age =
        Number(document.getElementById("age").value);

    const bmi =
        Number(document.getElementById("bmi").value);

    const smoking =
        Number(document.getElementById("smoking").value);

    const family =
        Number(document.getElementById("family").value);

    const stress =
        Number(document.getElementById("stress").value);


    // Check that all fields are filled
    if (!age || !bmi || !stress) {

        alert("Please enter all required values.");

        return;
    }


    // Data sent to Flask
    const data = {

        BMI: bmi,

        Family_History: family,

        Smoking_Status: smoking,

        Age: age,

        Stress_Score: stress

    };


    try {

        // Send request to Flask
        const response = await fetch("/predict", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(data)

        });


        // Convert response to JSON
        const result = await response.json();


        // Display Risk
        document.getElementById("result").innerText =
            "Risk: " + result.risk;


        // Display Probability
        document.getElementById("probability").innerText =
            "Probability: " +
            (result.probability * 100).toFixed(1) +
            "%";

    }

    catch (error) {

        document.getElementById("result").innerText =
            "Risk: Error";

        document.getElementById("probability").innerText =
            "Unable to connect to server.";

        console.error(error);

    }

}

</script>

</body>

</html>
